# push のたびに自動テストを実行（公開は Cloudflare の Git 連携が自動で行う）
name: test

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: ロジックとAPIのテスト
        run: node tests/api.test.mjs && node tests/sim.mjs 300
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Playwright を準備
        run: |
          pip install playwright==1.56.0
          python -m playwright install --with-deps chromium
      - name: ブラウザE2Eテスト（PC / iPhone）
        run: python tests/e2e.py
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: screenshots
          path: test-results/
